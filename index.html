<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOF AI - Platform AI Mandiri</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .chat-box { 
            width: 100%; 
            max-width: 600px; 
            background: #1e1e1e; 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 90vh; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        h2 { 
            font-size: 1.3rem; 
            margin-bottom: 10px; 
            text-align: center; 
            color: #0084ff; 
            font-weight: bold; 
        }
        .api-config {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .api-config input {
            font-size: 0.8rem;
            padding: 8px 10px;
        }
        .messages { 
            flex: 1; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-right: 5px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 0.95rem; 
            word-wrap: break-word; 
        }
        .user { 
            background: #0084ff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .bot { 
            background: #2a2a2a; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            color: #e0e0e0; 
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
        }
        input:focus { 
            border-color: #0084ff; 
        }
        button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #0084ff; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #006bce; 
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>🚀 GHOF AI</h2>
    
    <!-- Kolom API Key Aman -->
    <div class="api-config">
        <input type="password" id="apiKeyInput" placeholder="Masukkan Groq API Key (gsk_...)" onchange="saveKey()">
        <button onclick="saveKey()" style="padding: 8px 12px; font-size: 0.8rem;">Simpan Kunci</button>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">Halo! Saya <b>GHOF AI</b>. Masukkan API Key Groq di atas sekali saja, lalu mulailah mengobrol!</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan untuk GHOF AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    // Ambil Kunci dari Memori HP jika pernah disimpan
    window.onload = function() {
        const savedKey = localStorage.getItem("GROQ_KEY");
        if (savedKey) {
            document.getElementById("apiKeyInput").value = savedKey;
        }
    }

    function saveKey() {
        const key = document.getElementById("apiKeyInput").value.trim();
        if (key) {
            localStorage.setItem("GROQ_KEY", key);
            alert("API Key berhasil disimpan di HP Anda!");
        }
    }

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messagesDiv = document.getElementById("messages");
        const apiKey = document.getElementById("apiKeyInput").value.trim();
        const text = input.value.trim();

        if (!apiKey) {
            alert("Harap masukkan Groq API Key terlebih dahulu di kolom atas!");
            return;
        }
        if (!text) return;

        messagesDiv.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "GHOF AI sedang memikirkan jawaban...";
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Nama kamu adalah GHOF AI, asisten AI mandiri yang ramah dan cerdas." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                loadingDiv.innerText = data.choices[0].message.content;
            } else {
                loadingDiv.innerText = "Error: API Key tidak valid atau terjadi masalah jaringan.";
            }
        } catch (error) {
            loadingDiv.innerText = "Gagal terhubung ke Groq API.";
            console.error(error);
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
