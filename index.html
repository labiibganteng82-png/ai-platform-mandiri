<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOF AI - Platform AI Mandiri</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .chat-box { 
            width: 100%; 
            max-width: 600px; 
            background: #1e1e1e; 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 90vh; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        h2 { 
            font-size: 1.3rem; 
            margin-bottom: 15px; 
            text-align: center; 
            color: #0084ff; 
            border-bottom: 1px solid #333; 
            padding-bottom: 10px; 
            font-weight: bold; 
        }
        .messages { 
            flex: 1; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-right: 5px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 0.95rem; 
            word-wrap: break-word; 
        }
        .user { 
            background: #0084ff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .bot { 
            background: #2a2a2a; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            color: #e0e0e0; 
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
        }
        input:focus { 
            border-color: #0084ff; 
        }
        button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #0084ff; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #006bce; 
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>🚀 GHOF AI</h2>
    <div class="messages" id="messages">
        <div class="message bot">Halo! Saya <b>GHOF AI</b>. Ada yang bisa saya bantu hari ini?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan untuk GHOF AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    // URL BACKEND COLAB TERBARU
    const BACKEND_URL = "https://disown-aqua-siberian.ngrok-free.dev"

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messagesDiv = document.getElementById("messages");
        const text = input.value.trim();
        if (!text) return;

        // Tampilkan pesan pengguna
        messagesDiv.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Tampilkan indikator memuat
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "GHOF AI sedang memikirkan jawaban...";
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch(`${BACKEND_URL}/api/generate`, {
                method: "POST",
                headers: { 
    "Content-Type": "application/json",
    "ngrok-skip-browser-warning": "true"
}
                body: JSON.stringify({
                    model: "llama3",
                    prompt: text,
                    stream: false
                })
            });

            const data = await response.json();
            loadingDiv.innerText = data.response;
        } catch (error) {
            loadingDiv.innerText = "Gagal terhubung ke GHOF AI. Pastikan server Colab masih berjalan aktif.";
            console.error(error);
        }
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
