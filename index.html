<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOF AI - Platform AI Mandiri</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 10px; 
        }
        .chat-box { 
            width: 100%; 
            max-width: 600px; 
            background: #1e1e1e; 
            border-radius: 12px; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            height: 90vh; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); 
        }
        h2 { 
            font-size: 1.3rem; 
            margin-bottom: 10px; 
            text-align: center; 
            color: #0084ff; 
            font-weight: bold; 
        }
        .status-bar {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .messages { 
            flex: 1; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-right: 5px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            max-width: 85%; 
            line-height: 1.5; 
            font-size: 0.95rem; 
            word-wrap: break-word; 
        }
        .user { 
            background: #0084ff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .bot { 
            background: #2a2a2a; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            color: #e0e0e0; 
        }
        .input-area { 
            display: flex; 
            gap: 10px; 
        }
        input { 
            flex: 1; 
            padding: 12px 15px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            font-size: 0.95rem; 
            outline: none; 
        }
        input:focus { 
            border-color: #0084ff; 
        }
        button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #0084ff; 
            color: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #006bce; 
        }
    </style>
</head>
<body>

<div class="chat-box">
    <h2>🚀 GHOF AI</h2>
    <div class="status-bar" id="statusBar">Engine: Groq Cloud (Llama 3.3)</div>
    <div class="messages" id="messages">
        <div class="message bot">Halo! Saya <b>GHOF AI</b>. Ada yang bisa saya bantu hari ini?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ketik pesan untuk GHOF AI..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Kirim</button>
    </div>
</div>

<script>
    // 1. KUNCI API GROQ CLOUD (UTAMA - Bebas Colab)
    const GROQ_API_KEY = "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";

    // 2. OPSIONAL: OLLAMA LOCAL/SERVER URL (CADANGAN)
    const OLLAMA_LOCAL_URL = ""; // Opsional, isi jika punya server Ollama sendiri

    async function sendMessage() {
        const input = document.getElementById("userInput");
        const messagesDiv = document.getElementById("messages");
        const text = input.value.trim();
        if (!text) return;

        // Tampilkan pesan pengguna
        messagesDiv.innerHTML += `<div class="message user">${text}</div>`;
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Indikator Loading
        const loadingDiv = document.createElement("div");
        loadingDiv.className = "message bot";
        loadingDiv.innerText = "GHOF AI sedang memikirkan jawaban...";
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Jika URL Ollama diisi, gunakan Ollama. Jika kosong, gunakan Groq API
        if (OLLAMA_LOCAL_URL) {
            await fetchFromOllama(text, loadingDiv);
        } else {
            await fetchFromGroq(text, loadingDiv);
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Fungsi Utama: Memanggil Groq API Cloud
    async function fetchFromGroq(text, loadingDiv) {
        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Nama kamu adalah GHOF AI, asisten AI mandiri yang ramah dan cerdas." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await response.json();
            if (data.choices && data.choices.length > 0) {
                loadingDiv.innerText = data.choices[0].message.content;
            } else {
                loadingDiv.innerText = "Error: Gagal memproses data dari Groq.";
            }
        } catch (error) {
            loadingDiv.innerText = "Gagal terhubung ke Groq API. Pastikan API Key sudah benar.";
            console.error(error);
        }
    }

    // Fungsi Cadangan: Memanggil Server Ollama
    async function fetchFromOllama(text, loadingDiv) {
        try {
            const response = await fetch(`${OLLAMA_LOCAL_URL}/api/generate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama3",
                    prompt: text,
                    stream: false
                })
            });
            const data = await response.json();
            loadingDiv.innerText = data.response;
        } catch (error) {
            loadingDiv.innerText = "Gagal terhubung ke Ollama.";
            console.error(error);
        }
    }
</script>

</body>
</html>
